<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campus Virtual</title>
<meta name="description" content="Campus Virtual: cursos con videos, evaluación y certificado.">
<meta name="theme-color" id="themeColor" content="#2952E3">
<link rel="icon" id="favicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Campus: encabezado azul rey con energía naranja; cada curso es una ruta y cada video un tramo hasta el certificado */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --sunk:#EAEEF8; --ink:#141B34; --muted:#5B6482; --line:#DCE1EE;
  --band:#2952E3; --band-2:#1A36B0; --band-ink:#FFFFFF; --band-muted:#C9D4FF; --band-soft:rgba(255,255,255,.14);
  --route:#2952E3; --route-ink:#FFFFFF; --asphalt:#28315A;
  --accent:#D5DBE5; --accent-ink:#141B34; --soft:#EEF1F6;
  --c1:#2952E3; --c2:#C9D0DB; --c3:#11A39A;
  --ok:#12946A; --ok-soft:#DDF4EB; --bad:#D63B3B; --bad-soft:#FBE3E3; --focus:#2952E3;
  --shadow:0 1px 2px rgba(20,27,52,.06),0 8px 24px rgba(20,27,52,.06);
  --ov-body:8,16,48; --ov-top:10,22,70; --ov-hero-a:14,28,96; --ov-hero-b:30,62,190; /* velos sobre la foto */
  --sheet:rgba(244,246,251,.88);
  --glass:rgba(255,255,255,.72);
  --f-display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1222; --surface:#151C33; --sunk:#1E2744; --ink:#E9EDF9; --muted:#9BA6C6; --line:#2A3458;
    --band:#2340C4; --band-2:#14257A; --band-ink:#FFFFFF; --band-muted:#B7C4FF; --band-soft:rgba(255,255,255,.12);
    --route:#7E9BFF; --route-ink:#0B1230; --asphalt:#2A3458;
    --accent:#D5DBE5; --accent-ink:#141B34; --soft:#262E44;
    --c1:#7E9BFF; --c2:#C9D0DB; --c3:#3CC9BF;
    --ok:#3FD19B; --ok-soft:#123528; --bad:#FF7272; --bad-soft:#3A1A1E; --focus:#D5DBE5;
    --shadow:none; --sheet:rgba(13,18,34,.88); --glass:rgba(21,28,51,.7); color-scheme:dark;
  }
}
/* Tonos por empresa: TRAMOS usa el azul de arriba; MATPICO, naranja. */
:root.tema-matpico{
  --band:#D2652F; --band-2:#9E4318; --band-muted:#FFE1CF;
  --route:#C4571F; --c1:#C4571F; --focus:#C4571F;
  --ov-body:30,18,10; --ov-top:120,45,15; --ov-hero-a:140,55,18; --ov-hero-b:215,105,50;
}
@media (prefers-color-scheme: dark){
  :root.tema-matpico{ --band:#B4521F; --band-2:#7A3010; --route:#FF9A5A; --route-ink:#2A1200; --c1:#FF9A5A; --focus:#FF9A5A; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(30px,4.4vw,44px);font-weight:800}
h2{font-size:24px;font-weight:800}
h3{font-size:18px;font-weight:700}
p{margin:0}
a{color:var(--route)}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.lead{font-size:18px;color:var(--muted);max-width:60ch}
.hint{font-size:14px;color:var(--muted)}

.top{background:linear-gradient(115deg,var(--band) 0%,var(--band-2) 100%);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;color:inherit;cursor:pointer;padding:0;text-align:left}
.brand b{display:block;font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand .mark{width:44px;height:44px;border-radius:12px;background:#EEF1F6;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.brand .mark img{width:32px;max-height:32px;object-fit:contain;display:block}
.brand .mark svg{width:20px;height:20px}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--band-muted);letter-spacing:.1em;text-transform:uppercase}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nav button{background:none;border:1px solid transparent;color:var(--band-ink);font:600 14px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer}
.nav button:hover{background:var(--band-soft)}
.nav button[aria-current="page"]{background:var(--band-soft);border-color:var(--band-soft)}
.lane{height:5px;background:var(--accent)}

main{padding-block:28px 64px;display:grid;gap:36px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 15px var(--f-body);padding:11px 18px;border-radius:10px;border:1px solid var(--route);background:var(--route);color:var(--route-ink);cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--route)}
.btn.warn{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:8px}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.busy{opacity:.7;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.chip{display:inline-flex;align-items:center;gap:4px;font:600 13px var(--f-body);padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.go{background:var(--soft);color:var(--ink)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.run{background:var(--sunk);color:var(--route)}

.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:stretch}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:clamp(22px,4vw,32px);background:linear-gradient(135deg,var(--band) 0%,var(--band-2) 100%);color:var(--band-ink);display:grid;gap:14px;align-content:start}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:200px;height:200px;border-radius:50%;background:var(--accent);opacity:.95}
.hero::before{content:"";position:absolute;right:100px;top:40px;width:56px;height:56px;border-radius:50%;border:10px solid var(--band-soft)}
.hero > *{position:relative;z-index:1}
.hero .eyebrow{color:var(--band-muted)}
.hero .lead,.hero .muted{color:var(--band-muted)}
.hero h1{color:var(--band-ink)}
.intro > *{min-width:0}
.steps{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:12px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps li > span{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 16px var(--f-display)}
.steps b{display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:16px;box-shadow:var(--shadow)}
.note{background:var(--soft);border-radius:var(--r);padding:12px 14px;font-size:15px}
.note.demo{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;border:1px dashed var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:var(--r);padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:9px;border-radius:4px;font:600 15px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:14px}
.field small{color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=url],input[type=password],select,textarea{font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;width:100%}
textarea{min-height:64px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.err{color:var(--bad);font-size:14px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hello{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.hello.hero{display:flex;padding:28px 32px}
.hello.hero::before{display:none}
.hello.hero::after{width:150px;height:150px;right:-85px;top:-85px}
/* Foto de fondo de toda la página (según la empresa).
   Los títulos van en blanco sobre la foto; tarjetas, formularios y tablas conservan su fondo sólido. */
.con-foto body{background:#0E1838}
.con-foto body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(var(--ov-body),.62) 0%,rgba(var(--ov-body),.38) 45%,rgba(var(--ov-body),.62) 100%),var(--foto) center 62%/cover no-repeat}
.con-foto .top{background:linear-gradient(180deg,rgba(var(--ov-top),.5) 0%,rgba(var(--ov-top),.14) 100%);text-shadow:0 1px 3px rgba(0,0,0,.45)}
.con-foto .lane{background:rgba(213,219,229,.85)}
.con-foto main{--ink:#FFFFFF;--muted:rgba(232,238,255,.88);color:var(--ink)}
.con-foto main .back{color:#FFFFFF}
.con-foto main:not(.hoja) :is(.chead,#courseDates,.hello,#eval > div > .row) .btn.ghost{color:#FFFFFF;border-color:rgba(255,255,255,.7)}
.con-foto main :is(.panel,.card,.stop,fieldset,.tablewrap,.tile,.note,.cert,.result,.qbox,.savebar,.clist .item,.opt,.chip,input,select,textarea){--ink:#141B34;--muted:#5B6482;color:var(--ink)}
.con-foto main .chip{color:var(--muted)}
.con-foto main .chip.run{color:var(--route)} .con-foto main .chip.ok{color:var(--ok)} .con-foto main .chip.bad{color:var(--bad)}
.con-foto .hero{background:linear-gradient(120deg,rgba(var(--ov-hero-a),.5) 0%,rgba(var(--ov-hero-b),.22) 100%);border:1px solid rgba(255,255,255,.22);text-shadow:0 1px 4px rgba(0,0,0,.35)}
.con-foto .hero .stat{background:rgba(255,255,255,.14);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
/* Tarjetas y formularios tipo vidrio: dejan ver la foto sin perder lectura */
.con-foto main:not(.hoja) :is(.panel,.card,.stop,fieldset,.tablewrap,.tile){background:var(--glass);backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px) saturate(1.1);border-color:rgba(255,255,255,.35)}
.con-foto main:not(.hoja) .note{background:rgba(238,241,246,.84);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.con-foto main:not(.hoja) :is(input,select,textarea,.opt,.seg){background:rgba(255,255,255,.6)}
.con-foto main:not(.hoja) .seg button[aria-selected="true"]{background:rgba(255,255,255,.95)}
.con-foto .hero::before{display:none}
/* Portada neutra (antes de ingresar): degradé del azul TRAMOS al naranja MATPICO */
.tema-neutro .top{background:linear-gradient(90deg,#2952E3 0%,#3A4FC0 45%,#D2652F 100%)}
.tema-neutro.con-foto .top{background:linear-gradient(90deg,rgba(26,54,176,.62) 0%,rgba(26,54,176,.3) 40%,rgba(196,87,31,.35) 70%,rgba(210,101,47,.62) 100%)}
.tema-neutro .hero{background:linear-gradient(110deg,#1E3EB8 0%,#3A4FC0 50%,#D2652F 100%)}
.tema-neutro.con-foto .hero{background:linear-gradient(110deg,rgba(14,28,96,.62) 0%,rgba(30,62,190,.34) 50%,rgba(210,101,47,.5) 100%)}
.tema-neutro main .btn:not(.ghost):not(.warn):not(.go){background:linear-gradient(90deg,#2952E3 0%,#C4571F 100%);border-color:transparent}
.tema-neutro .lane{background:linear-gradient(90deg,rgba(201,212,255,.85),rgba(255,214,190,.85))}
.con-foto .route::before{opacity:.9}
.con-foto .tabs{border-color:rgba(255,255,255,.3)}
.con-foto .tabs button{color:rgba(232,238,255,.8)} .con-foto .tabs button[aria-selected="true"]{color:#FFFFFF}
.con-foto main .field > label{color:#FFFFFF}
.con-foto main .panel .field > label,.con-foto main .qbox .field > label{color:var(--ink)}
.con-foto main.hoja{background:var(--sheet);border-radius:22px;width:min(1140px,calc(100% - 20px));margin:28px auto 48px;padding-left:clamp(16px,3vw,32px);padding-right:clamp(16px,3vw,32px);--ink:#141B34;--muted:#5B6482}
.con-foto main.hoja :is(.tabs button){color:var(--muted)} .con-foto main.hoja .tabs button[aria-selected="true"]{color:var(--route)} .con-foto main.hoja .tabs{border-color:var(--line)}
.con-foto main.hoja .field > label{color:var(--ink)}
@media (prefers-color-scheme: dark){
  .con-foto main :is(.panel,.card,.stop,fieldset,.tablewrap,.tile,.note,.cert,.result,.qbox,.savebar,.clist .item,.opt,.chip,input,select,textarea){--ink:#E9EDF9;--muted:#9BA6C6}
  .con-foto main.hoja{--ink:#E9EDF9;--muted:#9BA6C6}
  .con-foto main .cert{--ink:#141B34;--muted:#5B6482}
  .con-foto main:not(.hoja) :is(input,select,textarea,.opt,.seg){background:rgba(13,18,34,.55)}
  .con-foto main:not(.hoja) .seg button[aria-selected="true"]{background:rgba(30,39,68,.95)}
  .con-foto main:not(.hoja) .note{background:rgba(38,46,68,.82)}
}
.intro > .panel{align-content:start}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--band-soft);border-radius:12px;padding:10px 16px;min-width:110px}
.stat b{display:block;font:800 26px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--band-muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{--cc:var(--c1);position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 20px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--cc)}
.card .eyebrow{color:var(--cc)}
.card:nth-child(3n+2){--cc:var(--c2)} .card:nth-child(3n+3){--cc:var(--c3)}
.card:nth-child(3n+2) .eyebrow{color:var(--muted)}
@media (hover:hover){ .card:hover{transform:translateY(-2px)} }
.card .meta{font-size:14px;color:var(--muted)}
.meta.late{color:var(--bad);font-weight:600}
.obl{color:var(--bad);font-weight:800}
.result.warn{background:var(--soft)}
.lbl{font-weight:600;font-size:14px;margin:0}
.aut{align-items:flex-start;font-size:15px;line-height:1.45}
.auttit{margin:0;font:800 17px var(--f-display);color:var(--route)}
.aut input{margin-top:3px;flex:none;width:18px;height:18px}
details.auttxt{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
details.auttxt summary{cursor:pointer;font-weight:600;color:var(--route)}
details.auttxt p{margin:8px 0}
.falta{background:var(--bad-soft);color:var(--bad);font-weight:700;padding:0 4px;border-radius:4px}
.empdatos{display:grid;grid-template-columns:1fr 1.5fr 1fr 1.4fr;gap:8px;margin:2px 0 14px 36px}
.empdatos input[data-k="politica"]{grid-column:1 / -1}
.empdatos input{font-size:14px;padding:7px 9px}
.con-foto main.hoja .lbl{color:var(--ink)}
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.road{height:8px;border-radius:999px;background:var(--sunk);position:relative;overflow:hidden}
.road i{position:absolute;inset:0 auto 0 0;background:var(--route);border-radius:999px}
.road-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}

.back{background:none;border:0;color:var(--route);font:600 15px var(--f-body);cursor:pointer;padding:0;justify-self:start}
.chead{display:grid;gap:10px}
.cmeta{display:flex;gap:8px;flex-wrap:wrap}
.route{list-style:none;margin:0;padding:0 0 0 48px;position:relative;display:grid;gap:14px}
.route::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:10px;border-radius:3px;background:var(--asphalt) repeating-linear-gradient(180deg,var(--accent) 0 12px,transparent 12px 24px) center/2px 100% no-repeat}
.stop{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:10px;min-width:0}
.pin{position:absolute;left:-48px;top:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--asphalt);font:800 16px var(--f-display);color:var(--ink)}
.stop.done .pin{background:var(--route);border-color:var(--route);color:var(--route-ink)}
.stop.exam .pin{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.player{display:grid;gap:8px}
.ratio{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden}
.ratio iframe,.ratio > div{position:absolute;inset:0;width:100%;height:100%;border:0}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0}

.quiz{display:grid;gap:18px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0;background:var(--surface);display:grid;gap:8px;min-width:0}
legend{float:left;width:100%;font-weight:700;padding:0;margin-bottom:6px;font-size:16px}
legend + *{clear:both}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:var(--r);border:1px solid var(--line);cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--route)}
.opt:has(input:checked){border-color:var(--route);background:var(--sunk)}
.result{border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.result.bad{background:var(--bad-soft)}
.result.ok{background:var(--ok-soft)}

.cert{--cert-c:#2952E3;background:#FFFFFF;color:#141B34;border:3px solid var(--cert-c);padding:8px;border-radius:2px;max-width:720px}
.cert-in{border:1.5px solid #C9D0DB;padding:28px 20px;text-align:center;display:grid;gap:6px}
.cert-logo{display:block;height:64px;width:auto;max-width:70%;margin:0 auto 4px;object-fit:contain}
.cert-co{font:800 18px var(--f-display);letter-spacing:.12em;color:var(--cert-c);text-transform:uppercase}
.cert-sub{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#5B6482}
.cert h3{font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,4vw,30px);margin:10px 0 4px;color:#141B34;letter-spacing:0}
.cert-name{font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,4vw,28px);font-weight:700;border-bottom:1px solid #141B34;justify-self:center;padding:0 18px 4px}
.cert-course{font:800 20px var(--f-display);color:var(--cert-c)}
.cert-meta{font-size:13px;color:#5B6482;margin-top:10px;font-variant-numeric:tabular-nums}
.code{font-family:var(--f-mono);font-size:14px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 16px var(--f-body);color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--route);border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile b{display:block;font:800 30px var(--f-display);font-variant-numeric:tabular-nums;color:var(--route)}
.tile span{font-size:14px;color:var(--muted)}
.tile.alert b{color:var(--bad)}
.cellstack{display:grid;gap:6px;justify-items:start}
.emprow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,.7fr) minmax(0,.7fr) 108px auto;gap:8px;align-items:center}
.emprow .n{font:800 16px var(--f-display);color:var(--muted);text-align:center}
@media (max-width:760px){
  .emprow{grid-template-columns:24px minmax(0,1fr) auto}
  .empdatos{margin-left:0;grid-template-columns:1fr 1fr}
  .emprow input[data-empfoto],.emprow input[data-emplogo]{grid-column:2 / 3}
  .emprow .chip{grid-column:2 / 3;justify-self:start}
}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr auto;gap:10px;align-items:end}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:880px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.num{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--muted)}

.editor{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.editor > *{min-width:0}
.clist{display:grid;gap:6px}
.clist button.item{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font:600 15px var(--f-body);color:var(--ink);cursor:pointer}
.clist button.item[aria-current="true"]{border-color:var(--route);box-shadow:inset 3px 0 0 var(--route)}
.ed-block{display:grid;gap:12px}
.vrow{display:grid;grid-template-columns:28px 1fr 1.3fr auto;gap:8px;align-items:center}
.vrow .n{font:800 16px var(--f-display);color:var(--muted);text-align:center}
.qbox{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--bg)}
.orow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.orow input[type=radio]{accent-color:var(--ok);width:18px;height:18px}
.savebar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.loading{padding:40px 0;color:var(--muted);text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;font-size:15px;max-width:calc(100% - 32px);z-index:20}

@media (max-width:900px){ .filters{grid-template-columns:1fr 1fr 1fr} }
@media (max-width:760px){
  .hero::after,.hello.hero::after{width:110px;height:110px;right:-62px;top:-62px}
  .hero::before{display:none}
  .hero > .eyebrow,.hello.hero .eyebrow{padding-right:44px}
  .intro,.editor{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr}
  .vrow{grid-template-columns:24px 1fr auto}
  .vrow input[data-f="vurl"]{grid-column:2 / 3}
  .stop{padding:14px}
}
@media (prefers-reduced-motion:no-preference){ .road i,.meter i{transition:width .5s ease} }
</style>
</head>

function demoErr(m){ throw new Error(m); }
function demoCant(c){ return c.preguntasEval && c.preguntasEval < c.questions.length ? c.preguntasEval : c.questions.length; }
function demoSetOk(c, set){ const n = demoCant(c); return Array.isArray(set) && set.length === n && new Set(set).size === n && set.every(i => Number.isInteger(i) && i >= 0 && i < c.questions.length); }
function demoCode(db){
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c;
  do { c = "TRM-" + new Date().getFullYear() + "-"; for(let i=0;i<6;i++) c += abc[Math.floor(Math.random()*abc.length)]; }
  while(db.progreso.some(r => r.codigo === c));
  return c;
}
async function localApi(accion, p){
  await new Promise(r => setTimeout(r, 150));
  p = p || {};
  const db = demoDb();
  const save = () => lsSet(DEMO_KEY, db);
  const now = () => new Date().toISOString();
  const limpiarDoc = d => String(d == null ? "" : d).toUpperCase().replace(/[^0-9A-Z]/g, "");
  const auth = () => {
    const doc = limpiarDoc(p.documento); const per = db.personas.find(x => x.documento === doc);
    if(!per || per.pin !== limpiarDoc(p.pin)) demoErr("Usuario o contraseña incorrectos.");
    return per;
  };
  const curso = id => db.catalogo.find(c => c.id === id) || demoErr("Ese curso ya no está disponible. Recarga la página.");
  const prog = (per, cid) => db.progreso.find(r => r.documento === per.documento && r.cursoId === cid);
  const empNombre = id => { const e = db.empresas.find(x => x.id === id); return e ? e.nombre : ""; };
  const perfilDe = per => ({nombre:per.nombre, documento:per.documento, cargo:per.cargo, sede:per.sede, empresaId:per.empresaId || "", empresa:empNombre(per.empresaId)});
  const estado = per => {
    const cursos = {};
    db.progreso.filter(r => r.documento === per.documento).forEach(r => {
      cursos[r.cursoId] = {inscrito:r.inscrito, vistos:r.vistos, intentos:r.intentos.length, mejorNota:r.mejorNota, aprobado:r.aprobado, fechaAprobacion:r.fechaAprobacion, codigo:r.codigo, venceEl:r.venceEl || null, horas:r.horas || null, extra:r.extra || 0, historial:r.historial || [], sinExamen:!!r.sinExamen};
    });
    return {perfil:perfilDe(per), cursos};
  };
  switch(accion){
    case "catalogo":
      return {empresas: clone(db.empresas), cursos: db.catalogo.map(c => Object.assign({}, c, {questions: c.questions.map(q => ({q:q.q, options:q.options}))}))};
    case "registro": {
      const nombre = String(p.nombre || "").trim().replace(/\s+/g, " "), documento = limpiarDoc(p.documento), pin = documento;
      if(nombre.split(" ").length < 2) demoErr("Escribe tu nombre y al menos un apellido.");
      if(!/^[0-9A-Z]{5,15}$/.test(documento)) demoErr("Revisa el número de cédula.");
      if(!db.empresas.some(e => e.id === p.empresaId)) demoErr("Selecciona la empresa donde trabajas.");
      if(!p.cargo) demoErr("Selecciona tu cargo.");
      if(p.autorizaDatos !== true) demoErr("Para registrarte debes autorizar el tratamiento de tus datos personales.");
      if(db.personas.some(x => x.documento === documento)) demoErr("Esa cédula ya está registrada. Ingresa con tu cédula como usuario y contraseña.");
      const per = {documento, nombre, empresaId:p.empresaId, cargo:String(p.cargo), sede:String(p.sede || "").trim(), registrado:now(), pin,
        autorizacion:{fecha:now(), version:String(p.versionAutorizacion || "")}};
      db.personas.push(per); save();
      return {estado: estado(per)};
    }
    case "ingreso": return {estado: estado(auth())};
    case "inscribir": {
      const per = auth(), c = curso(p.cursoId);
      if(!prog(per, c.id)){
        if(c.empresas && c.empresas.length && !c.empresas.includes(per.empresaId)) demoErr("Este curso no está disponible para tu empresa.");
        db.progreso.push({documento:per.documento, cursoId:c.id, inscrito:now(), vistos:{}, intentos:[], mejorNota:0, aprobado:false, fechaAprobacion:null, codigo:"", venceEl:null, horas:null, extra:0, historial:[], inicios:{}});
      }
      save(); return {estado: estado(per)};
    }
    case "iniciarVideo": {
      const per = auth(), c = curso(p.cursoId); const r = prog(per, c.id);
      if(r && !r.vistos[p.videoId] && !r.inicios[p.videoId]){ r.inicios[p.videoId] = Date.now(); save(); }
      return {};
    }
    case "video": {
      const per = auth(), c = curso(p.cursoId);
      if(!c.videos.some(v => v.id === p.videoId)) demoErr("Ese video ya no hace parte del curso. Recarga la página.");
      const r = prog(per, c.id) || demoErr("Primero inscríbete en el curso.");
      if(!r.vistos[p.videoId]){
        if(!p.prueba){   // el botón "(prueba)" solo existe en este modo; en la versión real siempre se comprueba
          const ini = r.inicios[p.videoId], dur = Number(p.duracion);
          if(!ini || !(dur > 0)) demoErr("Para que cuente, el video debe verse completo aquí en la página.");
          if((Date.now() - ini) / 1000 < Math.min(dur, 14400) * 0.9 - 5) demoErr("El video aún no se ha visto completo. Termínalo de ver en la página.");
        }
        r.vistos[p.videoId] = now();
        if(c.conEvaluacion === false && !r.aprobado && c.videos.every(v => r.vistos[v.id])){
          Object.assign(r, {aprobado:true, fechaAprobacion:now(), codigo:r.codigo || demoCode(db), sinExamen:true, mejorNota:0, horas:c.horas || null});
          r.venceEl = c.vigenciaMeses ? addMonths(r.fechaAprobacion, c.vigenciaMeses) : null;
        }
        save();
      }
      return {estado: estado(per)};
    }
    case "evaluacion": {
      const per = auth(), c = curso(p.cursoId);
      const r = prog(per, c.id) || demoErr("Primero inscríbete en el curso.");
      if(r.aprobado) demoErr("Ya aprobaste este curso.");
      if(c.conEvaluacion === false) demoErr("Este curso no tiene evaluación final.");
      if(!c.videos.every(v => r.vistos[v.id])) demoErr("Termina todos los videos antes de presentar la evaluación.");
      if(r.intentos.length >= (c.maxIntentos ? c.maxIntentos + (r.extra || 0) : Infinity)) demoErr("Agotaste los intentos de esta evaluación. Comunícate con Gestión Humana para que te habilite uno nuevo.");
      if(!demoSetOk(c, r.pendiente)){ r.pendiente = shuffle(c.questions.length).slice(0, demoCant(c)).sort((a,b) => a - b); save(); }
      return {preguntas: r.pendiente};
    }
    case "evaluar": {
      const per = auth(), c = curso(p.cursoId);
      const r = prog(per, c.id) || demoErr("Primero inscríbete en el curso.");
      if(r.aprobado) return {resultado:{nota:r.mejorNota, aprobado:true, incorrectas:[]}, estado: estado(per)};
      if(c.conEvaluacion === false) demoErr("Este curso no tiene evaluación final.");
      if(!c.videos.every(v => r.vistos[v.id])) demoErr("Termina todos los videos antes de presentar la evaluación.");
      if(r.intentos.length >= (c.maxIntentos ? c.maxIntentos + (r.extra || 0) : Infinity)) demoErr("Agotaste los intentos de esta evaluación. Comunícate con Gestión Humana para que te habilite uno nuevo.");
      const set = r.pendiente;
      if(!demoSetOk(c, set)) demoErr("La evaluación cambió. Recarga la página e inténtalo de nuevo.");
      const resp = p.respuestas || {};
      if(set.some(i => resp[i] === undefined || resp[i] === null)) demoErr("Responde todas las preguntas.");
      const incorrectas = set.filter(i => Number(resp[i]) !== c.questions[i].answer);
      const nota = Math.round((set.length - incorrectas.length) / set.length * 100);
      r.intentos.push({nota, fecha:now(), preguntas:set}); r.mejorNota = Math.max(r.mejorNota || 0, nota); r.pendiente = null;
      const aprobado = nota >= c.passScore;
      if(aprobado){ r.aprobado = true; r.fechaAprobacion = now(); r.codigo = r.codigo || demoCode(db); r.venceEl = c.vigenciaMeses ? addMonths(r.fechaAprobacion, c.vigenciaMeses) : null; r.horas = c.horas || null; }
      save();
      return {resultado:{nota, aprobado, incorrectas, total:set.length, notaMinima:c.passScore}, estado: estado(per)};
    }
    case "renovar": {
      const per = auth(), c = curso(p.cursoId);
      const r = prog(per, c.id);
      if(!r || !r.aprobado) demoErr("No tienes un certificado de este curso para renovar.");
      if(!r.venceEl || new Date(r.venceEl).getTime() > Date.now()) demoErr("Tu certificado aún está vigente.");
      r.historial.push({codigo:r.codigo, fechaAprobacion:r.fechaAprobacion, venceEl:r.venceEl, nota:r.mejorNota, horas:r.horas, sinExamen:!!r.sinExamen});
      Object.assign(r, {inscrito:now(), vistos:{}, intentos:[], mejorNota:0, aprobado:false, fechaAprobacion:null, codigo:"", venceEl:null, extra:0, horas:null, pendiente:null, inicios:{}, sinExamen:false});
      save(); return {estado: estado(per)};
    }
    case "demoVencer": {   // solo modo de prueba: simula que pasó el tiempo
      const per = auth(), c = curso(p.cursoId); const r = prog(per, c.id) || demoErr("No inscrito.");
      const ayer = new Date(Date.now() - 864e5).toISOString();
      if(p.que === "certificado" && r.aprobado) r.venceEl = ayer;
      if(p.que === "plazo") r.inscrito = new Date(Date.now() - ((c.plazoDias || 0) + 1) * 864e5).toISOString();
      save(); return {estado: estado(per)};
    }
    case "verificar": {
      const code = String(p.codigo || "").trim().toUpperCase();
      if(!code) demoErr("Escribe el código del certificado.");
      let r = db.progreso.find(x => x.codigo === code && x.aprobado), cert = null;
      if(r) cert = {fechaAprobacion:r.fechaAprobacion, venceEl:r.venceEl, nota:r.mejorNota, horas:r.horas, sinExamen:!!r.sinExamen};
      else { r = db.progreso.find(x => (x.historial || []).some(hh => hh.codigo === code)); if(r) cert = r.historial.find(hh => hh.codigo === code); }
      if(!r) return {valido:false};
      const per = db.personas.find(x => x.documento === r.documento); const c = db.catalogo.find(x => x.id === r.cursoId);
      return {valido:true, vigente: !cert.venceEl || new Date(cert.venceEl).getTime() > Date.now(), nombre: per ? per.nombre : "", empresa: per ? empNombre(per.empresaId) : "", documento:"•••" + r.documento.slice(-4), curso: c ? c.title : r.cursoId, fecha:cert.fechaAprobacion, venceEl:cert.venceEl || null, nota:cert.nota, horas:cert.horas || null, sinExamen:!!cert.sinExamen};
    }
    case "habilitarIntentos": {
      if(p.clave !== DEMO_CLAVE) demoErr("Clave de administración incorrecta.");
      const r = db.progreso.find(x => x.documento === limpiarDoc(p.documento) && x.cursoId === p.cursoId) || demoErr("No se encontró la inscripción.");
      if(r.aprobado) demoErr("Esta persona ya aprobó el curso.");
      r.extra = r.intentos.length; save(); return {};
    }
    case "admin":
      if(p.clave !== DEMO_CLAVE) demoErr("Clave de administración incorrecta.");
      return {cursos: clone(db.catalogo), empresas: clone(db.empresas), registros: db.personas.map(per => ({
        perfil:Object.assign(perfilDe(per), {registrado:per.registrado, autorizoEl:per.autorizacion ? per.autorizacion.fecha : null, autVersion:per.autorizacion ? per.autorizacion.version : ""}),
        cursos: db.progreso.filter(r => r.documento === per.documento).map(r => ({cursoId:r.cursoId, inscrito:r.inscrito, vistos:Object.keys(r.vistos).length, vistosIds:Object.keys(r.vistos), intentos:r.intentos.length, mejorNota:r.mejorNota, aprobado:r.aprobado, fechaAprobacion:r.fechaAprobacion, codigo:r.codigo, venceEl:r.venceEl || null, horas:r.horas || null, extra:r.extra || 0, renovaciones:(r.historial || []).length, sinExamen:!!r.sinExamen}))
      }))};
    case "guardarCatalogo":
      if(p.clave !== DEMO_CLAVE) demoErr("Clave de administración incorrecta.");
      if(!Array.isArray(p.cursos) || !p.cursos.length) demoErr("Debe haber al menos un curso.");
      db.catalogo = clone(p.cursos); save();
      return {cursos: clone(db.catalogo)};
    case "guardarEmpresas": {
      if(p.clave !== DEMO_CLAVE) demoErr("Clave de administración incorrecta.");
      const lista = (p.empresas || []).map(e => Object.assign({id:String(e.id || ""), nombre:String(e.nombre || "").trim(), foto:limpiarFoto(e.foto), logo:limpiarFoto(e.logo)}, datosLegales(e)));
      if(!lista.length) demoErr("Debe haber al menos una empresa.");
      if(lista.some(e => !e.id || !e.nombre)) demoErr("Hay una empresa sin nombre.");
      const nombres = lista.map(e => e.nombre.toLowerCase());
      if(new Set(nombres).size !== nombres.length) demoErr("Hay dos empresas con el mismo nombre.");
      const quitadas = db.empresas.filter(e => !lista.some(x => x.id === e.id));
      const enUso = quitadas.find(e => db.personas.some(per => per.empresaId === e.id));
      if(enUso) demoErr(`No se puede quitar ${enUso.nombre}: tiene personas registradas.`);
      db.empresas = lista; save();
      return {empresas: clone(db.empresas)};
    }
    default: demoErr("Acción desconocida.");
  }

async function api(accion, data){
  if(DEMO) return Object.assign({ok:true}, await localApi(accion, data));
  let res;
  try {
    res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({accion}, data||{}))});
  } catch(e){ throw new Error("No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo."); }
  let j; try { j = await res.json(); } catch(e){ throw new Error("El servidor respondió algo inesperado. Inténtalo de nuevo."); }
  if(!j.ok) throw new Error(j.error || "No se pudo completar la acción.");
  return j;
}

/* ---------------- plazos, vigencia e intentos ---------------- */
const DAY = 864e5;
function addMonths(iso, m){ const d = new Date(iso); const day = d.getDate(); d.setMonth(d.getMonth() + m); if(d.getDate() < day) d.setDate(0); return d.toISOString(); }
const horasTxt = h => { const n = Number(h) || 0; return `${String(n).replace(".", ",")} ${n === 1 ? "hora" : "horas"}`; };
function plazoHasta(c, rc){ return (rc && c.plazoDias && rc.inscrito) ? new Date(new Date(rc.inscrito).getTime() + c.plazoDias * DAY).toISOString() : null; }
function plazoVencido(c, rc){ const p = plazoHasta(c, rc); return !!(p && !rc.aprobado && Date.now() > new Date(p).getTime()); }
function certVencido(rc){ return !!(rc && rc.aprobado && rc.venceEl && Date.now() > new Date(rc.venceEl).getTime()); }
function venceProntoCert(rc){ return !!(rc && rc.aprobado && rc.venceEl && !certVencido(rc) && new Date(rc.venceEl).getTime() - Date.now() < 30 * DAY); }
function intentosPermitidos(c, rc){ return c.maxIntentos ? c.maxIntentos + ((rc && rc.extra) || 0) : Infinity; }
function intentosRestantes(c, rc){ return Math.max(0, intentosPermitidos(c, rc) - ((rc && rc.intentos) || 0)); }
function sinIntentos(c, rc){ return !!rc && !rc.aprobado && intentosRestantes(c, rc) === 0; }
function requiereAtencion(c, rc){ return !!rc && (certVencido(rc) || venceProntoCert(rc) || sinIntentos(c, rc) || plazoVencido(c, rc)); }
function shuffle(n){ const a = [...Array(n).keys()]; for(let i = n - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const preguntasPorEval = c => c.preguntasEval && c.preguntasEval < c.questions.length ? c.preguntasEval : c.questions.length;
function quizOrder(c, set){
  // Orden aleatorio de las preguntas asignadas y de sus opciones; se mantiene mientras se responde.
  S.quizOrder = S.quizOrder || {};
  const key = set.join(",");
  let o = S.quizOrder[c.id];
  if(!o || o.key !== key){
    const pos = shuffle(set.length);
    o = {key, q:pos.map(i => set[i]), o:{}};
    set.forEach(qi => { o.o[qi] = shuffle(c.questions[qi].options.length); });
    S.quizOrder[c.id] = o;
  }
  return o;
}
const loadingSet = {};
async function loadQuizSet(c){
  if(loadingSet[c.id]) return; loadingSet[c.id] = true;
  try {
    const r = await api("evaluacion", Object.assign(authData(), {cursoId:c.id}));
    S.quizSet = S.quizSet || {}; S.quizSet[c.id] = r.preguntas;
  } catch(e){ S.quizSetErr = {cid:c.id, msg:e.message}; }
  finally { loadingSet[c.id] = false; }
  if(S.view.name === "course" && S.view.id === c.id) refreshCourse(c);
}

const rcOf = c => S.estado && S.estado.cursos[c.id];
function watchedCount(c, rc){ if(!rc) return 0; return c.videos.filter(v => rc.vistos && rc.vistos[v.id]).length; }
function allWatched(c, rc){ return !!rc && c.videos.length > 0 && watchedCount(c, rc) === c.videos.length; }
function progressPct(c, rc){ if(!rc) return 0; return Math.round((watchedCount(c, rc) + (rc.aprobado ? 1 : 0)) / (c.videos.length + 1) * 100); }
const conEval = c => c.conEvaluacion !== false;
function visibleParaEmpresa(c, empId){ return !c.empresas || !c.empresas.length || c.empresas.includes(empId); }
function visibleParaMi(c){ return visibleParaEmpresa(c, S.estado && S.estado.perfil ? S.estado.perfil.empresaId : null); }
function misCursos(){ return S.courses.filter(c => rcOf(c) || visibleParaMi(c)); }
function pendienteObl(c, rc){ return !!c.obligatorio && (!rc || !rc.aprobado || certVencido(rc)); }
function status(c, rc){
  if(!rc) return c.obligatorio ? {label:"Obligatorio · sin iniciar", cls:"bad"} : {label:"Sin inscribir", cls:""};
  if(certVencido(rc)) return {label:"Certificado vencido", cls:"bad"};
  if(venceProntoCert(rc)) return {label:"Vence pronto", cls:"go"};
  if(rc.aprobado) return {label:rc.sinExamen ? "Completado" : "Aprobado", cls:"ok"};
  if(sinIntentos(c, rc)) return {label:"Intentos agotados", cls:"bad"};
  if(plazoVencido(c, rc)) return {label:"Plazo vencido", cls:"bad"};
  if(rc.intentos) return {label:"Por aprobar", cls:"bad"};
  if(allWatched(c, rc)) return {label:"Listo para evaluación", cls:"go"};
  if(watchedCount(c, rc)) return {label:"En curso", cls:"run"};
  return {label:"Inscrito", cls:"run"};
}

function nombreMarca(n){
  // "TRAMOS" -> "Tramos"; deja siglas societarias en mayúscula (SAS, LTDA…)
  return String(n || "").trim().split(/\s+/).map(w => /^(S\.?A\.?S\.?|S\.?A\.?|LTDA\.?|E\.?U\.?)$/i.test(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ");
}
function logoDe(e){ return (e.logo ? limpiarFoto(e.logo) : "") || LOGOS_INCLUIDOS[e.id] || ""; }
function marcaActual(){
  // Antes de iniciar sesión: los logos de las dos primeras empresas, uno a cada lado. Después: el de su empresa.
  const id = S.auth && S.estado && S.estado.perfil ? S.estado.perfil.empresaId : null;
  const e = id && S.empresas.find(x => x.id === id);
  if(!e){
    const con = S.empresas.filter(x => logoDe(x));
    if(con.length >= 2) return {nombre:"", logo:logoDe(con[0]), alt:con[0].nombre, logo2:logoDe(con[1]), alt2:con[1].nombre, fav:LOGO_NEUTRO};
    return {nombre:"", logo:LOGO_NEUTRO};
  }
  return {nombre:nombreMarca(e.nombre), logo:(e.logo ? limpiarFoto(e.logo) : "") || LOGOS_INCLUIDOS[e.id] || LOGO_NEUTRO};
}
let marcaPintada = null;
function aplicarMarca(){
  const m = marcaActual(); const key = m.nombre + "|" + m.logo + "|" + (m.logo2 || "");
  if(key === marcaPintada) return; marcaPintada = key;
  const img = $("#brandLogo"); img.src = m.logo; img.alt = m.alt || m.nombre || "Campus Virtual";

function updateChrome(){

function go(view){
  stopPlayer(); S.view = view; S.quizResult = null; S.confirm = null; S.formErr = "";
  const h = view.name === "admin" ? "#admin" : view.name === "verify" ? "#verificar" : view.name === "course" ? "#curso/" + view.id : "";
  if(location.hash !== h) history.replaceState(null, "", h || location.pathname);
  render(); window.scrollTo(0,0);
  if(S.auth && (view.name === "home" || view.name === "course")) refreshEstado();
}
let refreshing = false;
async function refreshEstado(){
  // Trae el avance más reciente (por ejemplo, si Gestión Humana habilitó intentos).
  if(refreshing || !S.auth) return; refreshing = true;
  try {
    const r = await api("ingreso", authData());
    const changed = JSON.stringify(r.estado) !== JSON.stringify(S.estado);
    S.estado = r.estado;
    if(changed && !S.playerVid && ["home","course"].includes(S.view.name)) render();
  } catch(e){} finally { refreshing = false; }
}
function render(){
  const kept = {}; const focusId = document.activeElement && document.activeElement.id;
  app.querySelectorAll(".keep").forEach(el => { if(el.id) kept[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  updateChrome();
  const v = S.view; let html;
  if(v.name === "course") html = S.auth ? viewCourse(v.id) : viewHome();
  else if(v.name === "admin") html = viewAdmin();
  else if(v.name === "verify") html = viewVerify();
  else html = viewHome();
  app.innerHTML = html;
  app.classList.toggle("hoja", v.name === "admin");
  Object.keys(kept).forEach(id => { const el = document.getElementById(id); if(el && el.classList.contains("keep")){ if(el.type === "checkbox") el.checked = kept[id]; else el.value = kept[id]; } });
  if(focusId){ const el = document.getElementById(focusId); if(el && el.classList.contains("keep")) el.focus(); }
  if(v.name === "admin" && S.admin && S.adminTab === "report") renderReport();
  actualizarFoto();
}

function examHint(c, rc){ if(!conEval(c)) return certVencido(rc) ? "Tu certificado venció. Renueva el curso abajo." : rc.aprobado ? "Curso completado. Tu certificado está abajo." : `Al terminar los ${c.videos.length} videos recibes tu certificado.`;

function stopControls(c, rc, v){
  const seen = !!(rc.vistos && rc.vistos[v.id]);
  const open = S.playerVid === v.id;
  let h = open ? `<button class="btn small ghost" type="button" data-action="close-video">Cerrar video</button>`
               : `<button class="btn small ${seen?"ghost":""}" type="button" data-action="play" data-cid="${esc(c.id)}" data-vid="${esc(v.id)}">${seen ? "Ver de nuevo" : "Ver video"}</button>`;
  if(seen) h += `<span class="chip ok">Visto el ${esc(fmtShort(rc.vistos[v.id]))}</span>`;
  else if(DEMO) h += `<button class="btn small ghost" type="button" data-action="manual-seen" data-cid="${esc(c.id)}" data-vid="${esc(v.id)}" title="Solo existe en modo de prueba">Marcar como visto (prueba)</button>`;
  return h;
}
function refreshCourse(c){
  const rc = rcOf(c); if(!rc) return render();
  c.videos.forEach((v,i) => {
    const li = document.getElementById("stop-" + v.id); if(!li) return;
    const seen = !!(rc.vistos && rc.vistos[v.id]);
    li.classList.toggle("done", seen);
    li.querySelector(".pin").textContent = seen ? "✓" : i+1;
    const ctl = document.getElementById("ctl-" + v.id); if(ctl) ctl.innerHTML = stopControls(c, rc, v);
  });
  const ex = $("#stop-exam"); if(ex){ ex.classList.toggle("done", !!rc.aprobado); ex.querySelector(".pin").textContent = rc.aprobado ? "✓" : "E"; }
  const eh = $("#examHint"); if(eh) eh.textContent = examHint(c, rc);
  const sc = $("#seenCount"); if(sc) sc.textContent = `${watchedCount(c, rc)} de ${c.videos.length} videos vistos`;
  const ch = $("#courseChip"); if(ch){ const st = status(c, rc); ch.className = "chip " + st.cls; ch.textContent = st.label; }
  const ev = $("#eval"); if(ev) ev.innerHTML = evalSection(c, rc);
  const cd = $("#courseDates"); if(cd) cd.innerHTML = courseDates(c, rc);
}

/* ---------------- reproductor de YouTube ---------------- */
function ytId(u){
  try {
    const x = new URL(u);
    if(x.hostname.includes("youtu.be")) return x.pathname.slice(1).split("/")[0] || null;
    if(x.searchParams.get("v")) return x.searchParams.get("v");
    const m = x.pathname.match(/\/(embed|shorts|live)\/([^/?#]+)/); return m ? m[2] : null;
  } catch(e){ return null; }
}
let ytPromise;
function ytReady(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(!ytPromise) ytPromise = new Promise((resolve, reject) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if(prev) prev(); resolve(); };
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.onerror = () => { ytPromise = null; reject(); };
    document.head.appendChild(s);
  });
  return ytPromise;
}
function stopPlayer(){
  clearInterval(S.playerTimer); S.playerTimer = null;
  if(S.player){ try { S.player.destroy(); } catch(e){} }
  S.player = null;
  if(S.playerVid){ const box = document.getElementById("pl-" + S.playerVid); if(box){ box.innerHTML = ""; box.hidden = true; } }
  S.playerVid = null;
}
/* Avance de cada video guardado en este navegador, para retomarlo donde quedó. */
const progKey = v => "cv-video:" + (S.auth ? S.auth.documento : "") + ":" + v.id;
async function playVideo(c, v){
  stopPlayer();
  S.playerVid = v.id;
  const rc = rcOf(c);
  refreshCourse(c);
  const box = document.getElementById("pl-" + v.id); if(!box) return;
  box.hidden = false;
  const id = ytId(v.url);
  const seen = !!(rc && rc.vistos && rc.vistos[v.id]);
  const fallback = msg => {
    S.embedFail[v.id] = true;
    box.innerHTML = `<p class="note">${msg}${seen ? "" : " Para que cuente, el video debe verse completo aquí en la página. Avísale a Gestión Humana para que lo revisen o lo cambien."}</p>`;
    refreshCourse(c);
  };
  if(!id) return fallback("Este video no se puede mostrar aquí.");
  box.innerHTML = `<div class="ratio"><div id="ytp-${esc(v.id)}"></div></div>
    ${seen ? "" : `<div class="meter" aria-hidden="true"><i id="meter-${esc(v.id)}"></i></div><p class="hint" id="mhint-${esc(v.id)}">Este video no se puede adelantar. Se marcará como visto cuando lo termines.</p>`}`;
  try { await ytReady(); } catch(e){ return fallback("No se pudo cargar el reproductor."); }
  if(S.playerVid !== v.id) return;
  let maxSeen = seen ? Infinity : ((lsGet(progKey(v)) || {}).max || 0);
  let dur = 0, terminado = false, ultimoAviso = 0;
  if(!seen) api("iniciarVideo", Object.assign(authData(), {cursoId:c.id, videoId:v.id})).catch(() => {});
  const aviso = msg => { if(Date.now() - ultimoAviso > 3500){ toast(msg); ultimoAviso = Date.now(); } };
  const terminar = () => {
    if(terminado) return; terminado = true;
    lsSet(progKey(v), {max:dur});
    if(!(rcOf(c).vistos || {})[v.id]) markSeen(c, v, dur);
  };
  S.player = new YT.Player("ytp-" + v.id, {
    videoId:id, width:"100%", height:"100%",
    playerVars:{rel:0, playsinline:1, modestbranding:1, start: seen ? 0 : Math.floor(Math.max(0, maxSeen - 1))},
    events:{
      onError: ev => {
        if(S.playerVid !== v.id) return;
        const code = ev && ev.data;
        let msg;
        if(location.protocol === "file:") msg = "YouTube no reproduce videos dentro de un archivo abierto desde el computador. Cuando la página esté en una dirección web se verá aquí.";
        else if(code === 101 || code === 150) msg = "El dueño de este video no permite verlo dentro de otras páginas.";
        else if(code === 100) msg = "Este video ya no existe o es privado.";
        else msg = "No se pudo reproducir el video aquí.";
        stopPlayer(); S.playerVid = v.id; box.hidden = false; fallback(msg);
      },
      onStateChange: ev => {
        if(seen || ev.data !== YT.PlayerState.ENDED) return;
        dur = S.player.getDuration() || dur;
        if(maxSeen < dur - 3){ S.player.seekTo(maxSeen, true); S.player.playVideo(); aviso("No se puede adelantar el video. Debe verse completo."); }
        else terminar();
      },
      onPlaybackRateChange: ev => {
        if(!seen && ev.data > 1){ S.player.setPlaybackRate(1); aviso("Este video debe verse a velocidad normal."); }
      }
    }
  });
  function tick(){
    if(seen || !S.player || S.playerVid !== v.id || typeof S.player.getCurrentTime !== "function") return;
    dur = S.player.getDuration() || 0;
    const t = S.player.getCurrentTime() || 0;
    if(S.player.getPlaybackRate && S.player.getPlaybackRate() > 1) S.player.setPlaybackRate(1);
    if(t > maxSeen + 2.5){ S.player.seekTo(maxSeen, true); aviso("No se puede adelantar el video. Debe verse completo."); return; }
    if(t > maxSeen){ maxSeen = t; lsSet(progKey(v), {max:maxSeen}); }
    if(dur > 0){
      const m = document.getElementById("meter-" + v.id); if(m) m.style.width = Math.min(100, Math.round(maxSeen / dur * 100)) + "%";
      if(maxSeen >= dur - 1.5) terminar();
    }
  }
  S.playerTimer = setInterval(tick, 500);
}
async function markSeen(c, v, duracion, prueba){
  if(S.marking[v.id]) return; S.marking[v.id] = true;
  try {
    const r = await api("video", Object.assign(authData(), {cursoId:c.id, videoId:v.id, duracion, prueba:!!prueba}));
    S.estado = r.estado;
    const h = document.getElementById("mhint-" + v.id); if(h) h.textContent = "Video marcado como visto.";
    refreshCourse(c);
    const rc = rcOf(c);
    if(rc.aprobado && rc.sinExamen) toast("¡Completaste el curso! Tu certificado está listo.");
    else if(allWatched(c, rc) && !rc.aprobado) toast("Completaste los videos. La evaluación ya está habilitada.");
    else toast("Video marcado como visto");
  } catch(e){ toast(e.message); }
  finally { S.marking[v.id] = false; }
}

/* ---------------- evaluación y certificado ---------------- */
function evalSection(c, rc){
  if(certVencido(rc)) return `<div class="sec-head"><h2>Renovación</h2></div>
    <div class="panel"><h3>Tu certificado venció el ${esc(fmtDate(rc.venceEl))}</h3>
      <p class="muted">Para renovarlo debes ver de nuevo los videos y aprobar la evaluación. Tu certificado anterior queda guardado en el historial.</p>
      <div><button class="btn go" type="button" data-action="renew" data-cid="${esc(c.id)}">Renovar curso</button></div></div>`;
  if(rc.aprobado) return certSection(c, rc, S.estado.perfil);
  if(!conEval(c) || !allWatched(c, rc)) return "";
  const r = S.quizResult && S.quizResult.cid === c.id ? S.quizResult : null;
  const fail = r ? `<div class="result bad" style="margin-bottom:16px"><b>Obtuviste ${r.nota}%. Necesitas ${c.passScore}%.</b><span>Acertaste ${r.total - r.malas} de ${r.total} preguntas.${isFinite(intentosPermitidos(c, rc)) && intentosRestantes(c, rc) > 0 ? ` Te ${intentosRestantes(c, rc) === 1 ? "queda 1 intento" : "quedan " + intentosRestantes(c, rc) + " intentos"}.` : ""} Repasa los videos si lo necesitas; en el siguiente intento las preguntas cambian.</span></div>` : "";
  if(sinIntentos(c, rc)) return `<div class="sec-head"><h2>Evaluación</h2></div>${fail}
    <div class="result bad"><b>Agotaste los ${intentosPermitidos(c, rc)} intentos de la evaluación.</b><span>Comunícate con Gestión Humana para que te habilite un nuevo intento.</span></div>`;
  const set = S.quizSet && S.quizSet[c.id];
  if(!set){
    if(S.quizSetErr && S.quizSetErr.cid === c.id){ const m = S.quizSetErr.msg; S.quizSetErr = null; return `<div class="sec-head"><h2>Evaluación</h2></div>${fail}<p class="err">${esc(m)}</p>`; }
    setTimeout(() => loadQuizSet(c), 0);
    return `<div class="sec-head"><h2>Evaluación</h2></div>${fail}<p class="panel muted">Preparando tus preguntas…</p>`;
  }
  const o = quizOrder(c, set);
  const lim = intentosPermitidos(c, rc);
  return `<div class="sec-head"><h2>Evaluación</h2><span class="muted">Necesitas ${c.passScore}% para aprobar · Intento ${(rc.intentos || 0) + 1}${isFinite(lim) ? " de " + lim : ""}</span></div>
  ${fail}
  <form class="quiz" id="quizForm" data-cid="${esc(c.id)}" novalidate>
    ${o.q.map((qi, pos) => { const q = c.questions[qi]; return `<fieldset><legend>${pos+1}. ${esc(q.q)}</legend>
      ${o.o[qi].map(j => `<label class="opt" for="q-${qi}-${j}"><input type="radio" id="q-${qi}-${j}" name="q-${qi}" value="${j}" ${S.quizAnswers[qi]===j?"checked":""}><span>${esc(q.options[j])}</span></label>`).join("")}
    </fieldset>`; }).join("")}
    <p class="err" id="quizErr" hidden></p>
    <div><button class="btn go" type="submit">Enviar respuestas</button></div>
  </form>`;
}
function certSection(c, rc, p, admin){
  return `<div class="sec-head"><h2>${admin ? "Certificado" : "Tu certificado"}</h2><span class="muted">Código <span class="code">${esc(rc.codigo)}</span></span></div>
  <div style="display:grid;gap:16px">
    <div class="result ${venceProntoCert(rc) ? "warn" : "ok"}"><b>${rc.sinExamen ? "Curso completado." : `Aprobado con ${rc.mejorNota}%.`}</b><span>Fecha ${rc.sinExamen ? "de finalización" : "de aprobación"}: ${esc(fmtDate(rc.fechaAprobacion))}. ${rc.venceEl ? (venceProntoCert(rc) ? "Vence pronto: " : "Vigente hasta: ") + esc(fmtDate(rc.venceEl)) + "." : "Sin vencimiento."}</span></div>

}

function logoCertSrc(p){
  const id = p && p.empresaId; if(!id) return "";
  if(LOGOS_CERT[id]) return LOGOS_CERT[id].src;
  const e = S.empresas.find(x => x.id === id) || (S.admin && S.admin.empresas.find(x => x.id === id));
  return e && e.logo ? limpiarFoto(e.logo) : "";
}
function cargarLogoCert(p){
  // Devuelve {img, ratio} listo para el PDF, o null si la empresa no tiene logo.
  const src = logoCertSrc(p); if(!src) return Promise.resolve(null);
  const id = p.empresaId;
  if(LOGOS_CERT[id]) return Promise.resolve({img:LOGOS_CERT[id].src, ratio:LOGOS_CERT[id].ratio, tipo:"PNG"});
  return new Promise(res => {
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => {
      try { const cv = document.createElement("canvas"); cv.width = im.naturalWidth; cv.height = im.naturalHeight; cv.getContext("2d").drawImage(im, 0, 0);
        res({img:cv.toDataURL("image/png"), ratio:im.naturalWidth / im.naturalHeight, tipo:"PNG"}); } catch(e) { res(null); }
    };
    im.onerror = () => res(null); im.src = src;
  });
}
const colorCert = p => COLOR_CERT[p && p.empresaId] || {hex:"#2952E3", rgb:[41,82,227]};
function certPreview(c, rc, p){
  return `<div class="cert" style="--cert-c:${colorCert(p).hex}" aria-label="Vista previa del certificado"><div class="cert-in">
    ${logoCertSrc(p) ? `<img class="cert-logo" src="${esc(logoCertSrc(p))}" alt="${esc(p.empresa || "")}">` : `<p class="cert-co">${esc(p.empresa || "")}</p>`}<p class="cert-sub">Campus Virtual ${esc(nombreMarca(p.empresa))} · Gestión Humana</p>
    <h3>${rc.sinExamen ? "Certificado de finalización" : "Certificado de aprobación"}</h3><p>Se certifica que</p>
    <p class="cert-name">${esc(p.nombre)}</p>
    <p>identificado(a) con documento No. ${esc(p.documento)}, ${rc.sinExamen ? "completó" : "aprobó"} el curso</p>
    <p class="cert-course">${esc(c.title)}</p>
    <p>con una intensidad horaria de <b>${horasTxt(rc.horas || c.horas)}</b></p>
    <p class="cert-meta">${rc.sinExamen ? "" : `Calificación ${rc.mejorNota}% · `}${esc(fmtDate(rc.fechaAprobacion))}${rc.venceEl ? " · Vigente hasta " + esc(fmtDate(rc.venceEl)) : ""} · Código ${esc(rc.codigo)}</p>
  </div></div>`;
}
function verifyUrl(){ return location.origin + location.pathname + "#verificar"; }
async function downloadCert(c, rc, p){
  if(!window.jspdf){ toast("No se pudo preparar el PDF. Recarga la página e inténtalo de nuevo."); return; }
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({orientation:"landscape", unit:"mm", format:"a4"});
  const cx = 148.5;
  const cc = colorCert(p).rgb;
  d.setDrawColor(...cc); d.setLineWidth(1.4); d.rect(10,10,277,190);
  d.setDrawColor(201,208,219); d.setLineWidth(0.6); d.rect(14.5,14.5,268,181);
  d.setFillColor(...cc); d.rect(24,24,186,3,"F");
  d.setFillColor(201,208,219); d.rect(210,24,63,3,"F");
  const logo = await cargarLogoCert(p);
  if(logo){
    const lh = 17, lw = Math.min(60, lh * logo.ratio), lhh = lw / logo.ratio;
    try { d.addImage(logo.img, logo.tipo, cx - lw / 2, 31, lw, lhh); }
    catch(e){ d.setTextColor(...cc); d.setFont("helvetica","bold"); d.setFontSize(16); d.text(String(p.empresa || "").toUpperCase(), cx, 42, {align:"center"}); }
  } else {
    d.setTextColor(...cc); d.setFont("helvetica","bold"); d.setFontSize(16); d.text(String(p.empresa || "").toUpperCase(), cx, 42, {align:"center"});
  }

function reportRows(){
  const rows = [];
  S.admin.registros.forEach(r => {
    const mine = r.cursos.filter(x => S.admin.cursos.some(c => c.id === x.cursoId));
    // Obligatorios que la persona aún no ha iniciado
    const faltan = S.admin.cursos.filter(c => c.obligatorio && visibleParaEmpresa(c, r.perfil.empresaId) && !mine.some(x => x.cursoId === c.id));
    faltan.forEach(c => rows.push({p:r.perfil, c, rc:null, falta:true}));
    if(!mine.length && !faltan.length) rows.push({p:r.perfil, c:null, rc:null});
    mine.forEach(x => {
      const c = S.admin.cursos.find(k => k.id === x.cursoId);
      const vistos = c.videos.filter(v => (x.vistosIds||[]).includes(v.id)).length;
      const vmap = {}; (x.vistosIds || []).forEach(id => { vmap[id] = true; });
      rows.push({p:r.perfil, c, rc:Object.assign({}, x, {vistosN:vistos, vistos:vmap})});
    });
  });
  return rows;
}
function rowStatus(x){ return x.c ? status(x.c, x.rc) : {label:"Sin inscribir", cls:""}; }
const rowAlerta = x => !!x.c && (x.falta || requiereAtencion(x.c, x.rc));
function rowDates(x){
  if(!x.c || !x.rc) return "";
  if(x.rc.aprobado) return x.rc.venceEl ? (certVencido(x.rc) ? "Venció " : "Vence ") + fmtShort(x.rc.venceEl) : "No vence";
  const p = plazoHasta(x.c, x.rc); return p ? "Límite " + fmtShort(p) : "Sin plazo";
}
function filteredRows(){
  const f = S.filters; const q = f.q.trim().toLowerCase();
  return reportRows().filter(x => {
    if(f.emp !== "all" && x.p.empresaId !== f.emp) return false;
    if(f.course !== "all" && (!x.c || x.c.id !== f.course)) return false;
    if(f.state === "alert" && !rowAlerta(x)) return false;
    if(f.state === "oblig" && !x.falta) return false;
    if(f.state === "passed" && !(x.rc && x.rc.aprobado)) return false;
    if(f.state === "pending" && !(x.c && !(x.rc && x.rc.aprobado))) return false;
    if(f.state === "none" && x.c) return false;
    if(q){ const hay = [x.p.nombre, x.p.documento, x.p.empresa, x.p.cargo, x.p.sede, x.rc && x.rc.codigo].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b) => String(a.p.nombre).localeCompare(String(b.p.nombre), "es"));
}

      if(!x.c) return `<tr><td>${esc(x.p.nombre)}</td><td class="num">${esc(x.p.documento)}</td><td>${esc(x.p.empresa || "—")}</td><td>${esc(x.p.cargo)}</td><td class="muted">Sin inscripción</td><td></td><td></td><td></td><td><span class="chip">${st.label}</span></td><td></td><td></td></tr>`;
      return `<tr><td>${esc(x.p.nombre)}</td><td class="num">${esc(x.p.documento)}</td><td>${esc(x.p.empresa || "—")}</td><td>${esc(x.p.cargo)}</td><td>${esc(x.c.title)}<br><span class="${x.c.obligatorio ? "obl" : "muted"}" style="font-size:12px">${x.c.obligatorio ? "Obligatorio" : "Opcional"}</span></td>
        <td class="num">${x.rc.vistosN}/${x.c.videos.length}</td><td class="num">${x.rc.sinExamen || !conEval(x.c) ? "No aplica" : x.rc.intentos ? x.rc.mejorNota + "%" : "—"}</td>
        <td class="num">${conEval(x.c) ? x.rc.intentos + (isFinite(intentosPermitidos(x.c, x.rc)) ? " / " + intentosPermitidos(x.c, x.rc) : "") : "—"}</td>
        <td><div class="cellstack"><span class="chip ${st.cls}">${st.label}</span>${sinIntentos(x.c, x.rc) ? `<button class="btn small ghost" type="button" data-action="unlock" data-doc="${esc(x.p.documento)}" data-cid="${esc(x.c.id)}">Habilitar intentos</button>` : ""}</div></td>
        <td class="num">${esc(rowDates(x))}</td>
        <td>${x.rc.aprobado ? `<span class="code">${esc(x.rc.codigo)}</span> <button class="btn small ghost" type="button" data-action="admin-cert" data-doc="${esc(x.p.documento)}" data-cid="${esc(x.c.id)}">PDF</button>` : ""}</td></tr>`;
    }).join("")}
  </tbody></table>`;
}
function exportCsv(){
  const rows = filteredRows();
  const head = ["Nombre","Documento","Empresa","Cargo","Sede/área","Curso","Tipo","Evaluación final","Intensidad (horas)","Inscripción","Fecha límite","Videos vistos","Videos del curso","Mejor nota","Intentos","Estado","Fecha de aprobación","Vigente hasta","Código de certificado","Renovaciones","Autorizó datos (fecha)","Versión autorización"];
  const q = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const lines = [head.join(";")].concat(rows.map(x => {
    const c = x.c, rc = x.rc;
    return [
      x.p.nombre, x.p.documento, x.p.empresa, x.p.cargo, x.p.sede, c ? c.title : "", c ? (c.obligatorio ? "Obligatorio" : "Opcional") : "", c ? (conEval(c) ? "Sí" : "No") : "",
      c ? String((rc && rc.horas) || c.horas).replace(".", ",") : "", rc ? fmtShort(rc.inscrito) : "", c && rc && !rc.aprobado && plazoHasta(c, rc) ? fmtShort(plazoHasta(c, rc)) : "",
      c ? (rc ? rc.vistosN : 0) : "", c ? c.videos.length : "", rc && rc.intentos && !rc.sinExamen ? rc.mejorNota : "",
      rc && conEval(c) ? rc.intentos : "", rowStatus(x).label, rc && rc.aprobado ? fmtShort(rc.fechaAprobacion) : "",
      rc && rc.aprobado ? (rc.venceEl ? fmtShort(rc.venceEl) : "No vence") : "", (rc && rc.codigo) || "", rc ? (rc.renovaciones || 0) : "",
      x.p.autorizoEl ? fmtShort(x.p.autorizoEl) : "", x.p.autVersion || ""
    ].map(q).join(";");
  }));
  const blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "reporte-capacitaciones.csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function markDirty(){ S.dirty = true; S.edErr = ""; const s = $("#edState"); if(s){ s.className = "muted"; s.textContent = "Cambios sin guardar"; } }
function onEditorField(el){
  const f = el.dataset.f; const c = draftCourse(); if(!f || !c) return;
  const q = +el.dataset.q, o = +el.dataset.o, v = +el.dataset.v;
  if(f === "title"){ c.title = el.value; const b = app.querySelector(`.clist button[aria-current="true"] .t`); if(b) b.textContent = el.value || "Curso sin título"; }
  else if(f === "area") c.area = el.value;
  else if(f === "summary") c.summary = el.value;
  else if(f === "pass") c.passScore = Math.max(0, Math.min(100, parseInt(el.value, 10) || 0));
  else if(f === "horas") c.horas = Math.max(0, parseFloat(String(el.value).replace(",", ".")) || 0);
  else if(f === "plazo") c.plazoDias = Math.max(0, parseInt(el.value, 10) || 0);
  else if(f === "vig") c.vigenciaMeses = Math.max(0, parseInt(el.value, 10) || 0);
  else if(f === "emp"){ const set = new Set(c.empresas || []); if(el.checked) set.add(el.dataset.e); else set.delete(el.dataset.e); c.empresas = S.admin.empresas.map(e => e.id).filter(id => set.has(id)); }
  else if(f === "tipo"){ if(el.checked) c.obligatorio = el.value === "obl"; }
  else if(f === "coneval"){ const v = el.checked; if(c.conEvaluacion !== v){ c.conEvaluacion = v; markDirty(); render(); return; } }
  else if(f === "npreg") c.preguntasEval = Math.max(0, parseInt(el.value, 10) || 0);
  else if(f === "maxint") c.maxIntentos = Math.max(0, parseInt(el.value, 10) || 0);
  else if(f === "vtitle") c.videos[v].title = el.value;
  else if(f === "vurl") c.videos[v].url = el.value.trim();
  else if(f === "qtext") c.questions[q].q = el.value;
  else if(f === "opt") c.questions[q].options[o] = el.value;
  else if(f === "ans") c.questions[q].answer = o;
  markDirty();
}
function cleanCatalog(){
  const out = [];
  for(const c of S.draft){
    const name = c.title.trim();
    if(!name) return {err:"Hay un curso sin nombre."};
    const videos = c.videos.filter(v => v.url.trim() || v.title.trim());
    if(!videos.length) return {err:`El curso “${name}” necesita al menos un video.`};
    for(const v of videos){
      if(!v.title.trim()) return {err:`Un video de “${name}” no tiene título.`};
      if(!/^https?:\/\//i.test(v.url)) return {err:`Revisa el enlace del video “${v.title}” en “${name}”. Debe empezar por https://`};
      if(!ytId(v.url)) return {err:`El enlace del video “${v.title}” no parece de YouTube.`};
    }
    const questions = [];
    const ev = c.conEvaluacion !== false;
    for(let i = 0; i < c.questions.length; i++){
      const q = c.questions[i];
      if(!q.q.trim() && q.options.every(o => !o.trim())) continue;
      const opts = q.options.map((o,j) => ({o:o.trim(), j})).filter(x => x.o);
      if(!ev && (!q.q.trim() || q.options.filter(o => o.trim()).length < 2)) continue;   // sin evaluación: se guardan solo las preguntas completas
      if(!q.q.trim()) return {err:`La pregunta ${i+1} de “${name}” no tiene enunciado.`};
      if(opts.length < 2) return {err:`La pregunta ${i+1} de “${name}” necesita al menos dos opciones.`};
      const ans = opts.findIndex(x => x.j === q.answer);
      if(ans < 0){ if(!ev) continue; return {err:`Marca la respuesta correcta de la pregunta ${i+1} de “${name}”.`}; }
      questions.push({q:q.q.trim(), options:opts.map(x => x.o), answer:ans});
    }
    if(ev && !questions.length) return {err:`El curso “${name}” necesita al menos una pregunta, o desactiva su evaluación final.`};
    if(!(c.horas > 0)) return {err:`Indica la intensidad horaria de “${name}”.`};
    if(ev && (c.preguntasEval || 0) > questions.length) return {err:`“${name}” pide ${c.preguntasEval} preguntas por evaluación, pero el banco tiene ${questions.length}.`};
    out.push({id:c.id, area:(c.area||"").trim(), title:name, summary:(c.summary||"").trim(), passScore:c.passScore || 80,
      horas:c.horas, plazoDias:c.plazoDias || 0, vigenciaMeses:c.vigenciaMeses || 0, maxIntentos:c.maxIntentos || 0, preguntasEval:c.preguntasEval || 0,
      empresas:(c.empresas || []).slice(), obligatorio:!!c.obligatorio, conEvaluacion:ev,
      videos:videos.map(v => ({id:v.id, title:v.title.trim(), url:v.url.trim()})), questions});
  }
  return {cursos:out};
}

        S.quizResult = r.resultado.aprobado ? null : {cid:c.id, nota:r.resultado.nota, malas:r.resultado.incorrectas.length, total:r.resultado.total || set.length};
        refreshCourse(c);
        if(r.resultado.aprobado) toast(`¡Aprobaste con ${r.resultado.nota}%!`);
        const ev = $("#eval"); if(ev) ev.scrollIntoView({block:"start"});
      } catch(err){ const er = $("#quizErr"); if(er){ er.hidden = false; er.textContent = err.message; } }
    });
  }
  if(f.id === "verifyForm"){
    const code = $("#vf-code").value.trim();
    if(!code){ S.verify = {error:"Escribe el código del certificado."}; render(); return; }
    return busy(btn, async () => {
      try { S.verify = await api("verificar", {codigo:code}); } catch(err){ S.verify = {error:err.message}; }
      render();
    });
  }
  if(f.id === "adminForm"){
    const clave = $("#ad-clave").value;
    if(!clave){ S.formErr = "Escribe la clave."; render(); return; }
    return busy(btn, async () => {
      try { await adminLoad(clave); S.formErr = ""; render(); }
      catch(err){ S.formErr = err.message; render(); }
    });
  }
});

function routeFromHash(){
  const h = location.hash;
  if(h === "#admin") S.view = {name:"admin"};
  else if(h === "#verificar") S.view = {name:"verify"};
  else if(h.startsWith("#curso/")) S.view = {name:"course", id:decodeURIComponent(h.slice(7))};
  else S.view = {name:"home"};
  stopPlayer(); render();
}

const CAMPOS_LEGALES = ["nit","direccion","telefono","correo","politica"];
function datosLegales(e){
  const o = {}; CAMPOS_LEGALES.forEach(k => { o[k] = String((e && e[k]) || "").trim().slice(0, 200); });
  if(o.politica && !/^https?:\/\//i.test(o.politica)) o.politica = "";
  return o;
}
function limpiarFoto(f){
  f = String(f || "").trim();
  if(/^https:\/\/[^\s"'()<>]+$/i.test(f)) return f;
  return f.replace(/[^A-Za-z0-9._\-\/]/g, "").replace(/\.\.+/g, ".").slice(0, 120);
}
function fotosEmpresa(id){
  // Primero el archivo indicado en Administración (si existe); si no, la foto incluida en la página.
  const e = S.empresas.find(x => x.id === id);
  return [e && e.foto ? limpiarFoto(e.foto) : "", FOTOS_INCLUIDAS[id] || ""].filter(Boolean);
}
function empresaVisible(){
  // Solo después de iniciar sesión se muestra la empresa (foto, tonos y logo). Antes, todo es general.
  return S.auth && S.estado && S.estado.perfil ? (S.estado.perfil.empresaId || null) : null;
}
function fotoQueToca(){
  const id = empresaVisible();
  return id ? fotosEmpresa(id) : [FOTO_FONDO, FOTOS_INCLUIDAS.general];
}
const TEMAS = ["matpico"];
function aplicarTema(){
  const id = empresaVisible(), root = document.documentElement;
  TEMAS.forEach(t => root.classList.toggle("tema-" + t, id === t));
  root.classList.toggle("tema-neutro", !id);
  const tc = $("#themeColor"); if(tc) tc.content = id === "matpico" ? "#D2652F" : "#2952E3";
}
const fotoOk = {};
let fotoActual = null;
function actualizarFoto(){
  aplicarTema();
  probarFotos(fotoQueToca().filter(Boolean));
}
function probarFotos(lista){
  const root = document.documentElement;
  const url = lista.find(u => fotoOk[u] !== false);
  if(!url){ root.classList.remove("con-foto"); fotoActual = null; return; }
  if(fotoOk[url] === true){
    if(fotoActual !== url){ root.style.setProperty("--foto", `url("${url.replace(/"/g, "")}")`); fotoActual = url; }
    root.classList.add("con-foto"); return;
  }
  const img = new Image();
  img.onload = () => { fotoOk[url] = true; actualizarFoto(); };
  img.onerror = () => { fotoOk[url] = false; actualizarFoto(); };
  img.src = url;
}
async function boot(){
  const saved = lsGet(LS_SESSION);
  await loadCatalog();
  if(saved && saved.documento && saved.pin){
    try { const r = await api("ingreso", saved); S.auth = saved; S.estado = r.estado; }
    catch(e){ lsDel(LS_SESSION); }
  }
  routeFromHash();
}
boot();
</script>
